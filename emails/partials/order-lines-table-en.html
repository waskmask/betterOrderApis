<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:16px 0;border-collapse:collapse;">
  <thead>
    <tr>
      <th align="left" style="padding:8px 0;border-bottom:1px solid #ebebeb;font-size:12px;color:#717171;">Item</th>
      <th align="center" style="padding:8px 0;border-bottom:1px solid #ebebeb;font-size:12px;color:#717171;">Qty</th>
      <th align="right" style="padding:8px 0;border-bottom:1px solid #ebebeb;font-size:12px;color:#717171;">Total</th>
    </tr>
  </thead>
  <tbody>
    {{#if orderLines}}
    {{orderLines}}
    {{/if}}
  </tbody>
</table>
