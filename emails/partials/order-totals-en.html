<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:12px 0;font-size:14px;color:#484848;">
  <tr><td style="padding:4px 0;">Subtotal</td><td align="right" style="padding:4px 0;">{{subtotal}}</td></tr>
  {{#if deliveryFee}}
  <tr><td style="padding:4px 0;">Delivery</td><td align="right" style="padding:4px 0;">{{deliveryFee}}</td></tr>
  {{/if}}
  {{#if discount}}
  <tr><td style="padding:4px 0;">Discount</td><td align="right" style="padding:4px 0;">{{discount}}</td></tr>
  {{/if}}
  {{#if tip}}
  <tr><td style="padding:4px 0;">Tip</td><td align="right" style="padding:4px 0;">{{tip}}</td></tr>
  {{/if}}
  <tr><td style="padding:8px 0;font-weight:700;border-top:1px solid #ebebeb;">Total</td><td align="right" style="padding:8px 0;font-weight:700;border-top:1px solid #ebebeb;">{{orderTotal}}</td></tr>
</table>
